name: Daily Attendance Notification

on:
  schedule:
    - cron: '40 8 * * *'   # 8:40 UTC = 11:40 صباحًا القاهرة (يصل قريب من 12 ظهرًا)
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run notification script
        run: node notify.js
