name: Weekly Backup to Telegram

on:
  schedule:
    - cron: '45 11 * * 5'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch attendance
        run: |
          curl -s "${{ secrets.SB_URL }}/rest/v1/attendance?select=*&order=created_at.asc" \
            -H "apikey: ${{ secrets.SB_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SB_KEY }}" \
            -o attendance_backup.json

      - name: Fetch stations
        run: |
          curl -s "${{ secrets.SB_URL }}/rest/v1/stations?select=*" \
            -H "apikey: ${{ secrets.SB_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SB_KEY }}" \
            -o stations_backup.json

      - name: Fetch manager_links
        run: |
          curl -s "${{ secrets.SB_URL }}/rest/v1/manager_links?select=*" \
            -H "apikey: ${{ secrets.SB_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SB_KEY }}" \
            -o links_backup.json

      - name: Send to Telegram
        run: |
          DATE=$(date +"%Y-%m-%d")
          curl -s -F document=@attendance_backup.json \
            -F chat_id="${{ secrets.CHAT_ID }}" \
            -F caption="نسخة احتياطية - الحضور - $DATE" \
            "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendDocument"

          curl -s -F document=@stations_backup.json \
            -F chat_id="${{ secrets.CHAT_ID }}" \
            -F caption="نسخة احتياطية - المحطات - $DATE" \
            "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendDocument"

          curl -s -F document=@links_backup.json \
            -F chat_id="${{ secrets.CHAT_ID }}" \
            -F caption="نسخة احتياطية - الروابط - $DATE" \
            "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendDocument"
