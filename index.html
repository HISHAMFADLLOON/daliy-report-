<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الحضور</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
:root{
  --bg:#07101e;--sur:#0e1a2c;--card:#132030;--border:rgba(255,255,255,0.07);
  --blue:#3b82f6;--green:#10b981;--red:#ef4444;--gold:#f59e0b;--purple:#8b5cf6;
  --pink:#ec4899;--text:#eef4ff;--muted:#506070;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

.login-wrap{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;z-index:999;}
.login-box{background:var(--sur);border:1px solid var(--border);border-radius:20px;
  padding:36px 28px;width:calc(100% - 48px);max-width:340px;text-align:center;}
.login-icon{width:52px;height:52px;border-radius:14px;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px;}
.login-title{font-size:20px;font-weight:900;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:22px;}
.login-input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:10px;padding:13px 15px;color:var(--text);font-family:'Cairo',sans-serif;
  font-size:15px;outline:none;margin-bottom:12px;transition:border .2s;
  text-align:right;display:block;}
.login-input:focus{border-color:var(--blue);}
.login-input::placeholder{color:var(--muted);}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--blue),var(--purple));
  border:none;border-radius:11px;color:#fff;font-family:'Cairo',sans-serif;
  font-size:15px;font-weight:900;cursor:pointer;}
.login-err{font-size:13px;color:var(--red);margin-top:10px;min-height:18px;}

.hdr{background:rgba(14,26,44,.95);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center;
  justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:100;}
.hdr-l{display:flex;align-items:center;gap:10px;}
.hdr-icon{width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:17px;}
.hdr-title{font-size:15px;font-weight:900;}
.hdr-sub{font-size:11px;color:var(--muted);}
.badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-gold{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);color:var(--gold);}
.badge-blue{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.22);color:var(--blue);}
.btn-logout{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:var(--red);
  border-radius:8px;padding:5px 11px;font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}

.tabs{display:flex;background:var(--sur);border-bottom:1px solid var(--border);
  padding:0 14px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:13px 15px;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--muted);font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;
  cursor:pointer;white-space:nowrap;transition:all .2s;}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);}

.view{display:none;padding:20px 16px;max-width:660px;margin:0 auto;}
.view.on{display:block;}
.sec{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--muted);
  text-transform:uppercase;margin:22px 0 10px;}
.sec:first-child{margin-top:0;}

.row{display:flex;gap:7px;}
input[type=text]{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:10px;padding:11px 13px;color:var(--text);font-family:'Cairo',sans-serif;
  font-size:14px;outline:none;transition:border .2s;}
input[type=text]:focus{border-color:var(--blue);}
input[type=text]::placeholder{color:var(--muted);}
input[type=date]{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:10px;padding:10px 13px;color:var(--text);font-family:'Cairo',sans-serif;
  font-size:14px;outline:none;}

.btn{padding:11px 15px;border-radius:10px;border:none;font-family:'Cairo',sans-serif;
  font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:transform .12s;}
.btn:active{transform:scale(.92);}
.btn-blue{background:var(--blue);color:#fff;}
.btn-green{background:var(--green);color:#001a0a;}
.btn-red{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.25);}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border);}

.info-box{border-radius:12px;padding:14px;font-size:13px;line-height:1.8;margin-bottom:16px;}
.ib-green{background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.2);color:var(--green);}

.st-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  margin-bottom:11px;overflow:hidden;}
.st-hdr{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.st-dot{width:9px;height:9px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--purple));flex-shrink:0;}
.st-tw{display:flex;align-items:center;gap:9px;}
.st-name{font-size:15px;font-weight:900;}
.st-meta{font-size:12px;color:var(--muted);margin-top:1px;}
.st-acts{display:flex;gap:7px;align-items:center;}
.chev{color:var(--muted);font-size:11px;transition:transform .25s;}
.st-card.open .chev{transform:rotate(180deg);}
.st-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border);}
.st-card.open .st-body{display:block;}
.mgr-badge{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.14);
  border-radius:10px;padding:11px 13px;margin-top:12px;
  display:flex;align-items:center;justify-content:space-between;}
.mgr-nm{font-size:14px;font-weight:700;color:var(--blue);}
.emp-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.emp-tag{background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:20px;padding:5px 11px;font-size:13px;display:flex;align-items:center;gap:6px;}
.emp-del{color:var(--red);cursor:pointer;font-size:14px;font-weight:900;}

.lnk-card{background:var(--card);border:1px solid var(--border);border-radius:13px;
  padding:15px;margin-bottom:11px;}
.lnk-top{display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:10px;gap:10px;}
.lnk-name{font-size:15px;font-weight:900;}
.lnk-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.cbtn{padding:7px 13px;border-radius:8px;font-family:'Cairo',sans-serif;font-weight:700;
  font-size:12px;cursor:pointer;border:none;white-space:nowrap;}
.cbtn-green{background:rgba(16,185,129,.14);color:var(--green);border:1px solid rgba(16,185,129,.25);}
.lnk-url{background:rgba(0,0,0,.35);border-radius:8px;padding:9px 11px;font-size:11px;
  color:var(--muted);word-break:break-all;font-family:monospace;direction:ltr;
  line-height:1.5;user-select:all;}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:13px 8px;text-align:center;}
.stat-n{font-size:25px;font-weight:900;line-height:1;}
.stat-n.b{color:var(--blue);}.stat-n.g{color:var(--gold);}.stat-n.gr{color:var(--green);}
.stat-l{font-size:11px;color:var(--muted);margin-top:3px;}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:13px;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:6px 13px;border-radius:20px;background:var(--card);border:1px solid var(--border);
  color:var(--muted);font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;
  cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .2s;}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue);}

.rec-card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:14px;margin-bottom:9px;}
.rec-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px;}
.rec-mgr{font-size:15px;font-weight:900;}
.rec-st{font-size:12px;color:var(--blue);margin-top:2px;}
.rec-dt{font-size:11px;color:var(--muted);margin-top:1px;}
.rec-del{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.2);color:var(--red);
  border-radius:7px;padding:5px 10px;font-family:'Cairo',sans-serif;font-size:12px;
  font-weight:700;cursor:pointer;}
.pills{display:flex;flex-wrap:wrap;gap:5px;}
.pill{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;}
.pill-p{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25);}
.pill-r{background:rgba(245,158,11,.12);color:var(--gold);border:1px solid rgba(245,158,11,.25);}
.pill-h{background:rgba(236,72,153,.12);color:var(--pink);border:1px solid rgba(236,72,153,.25);}
.pill-m{background:rgba(59,130,246,.12);color:var(--blue);border:1px solid rgba(59,130,246,.25);}
.pill-v{background:rgba(139,92,246,.12);color:var(--purple);border:1px solid rgba(139,92,246,.25);}
.pill-a{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25);}

.mgr-wrap{padding:16px;max-width:500px;margin:0 auto;}
.ip{background:var(--card);border:1px solid rgba(59,130,246,.2);border-radius:14px;
  padding:14px 16px;margin-bottom:16px;}
.ip-station{font-size:18px;font-weight:900;}
.ip-mgr{font-size:12px;color:var(--muted);margin-top:2px;}
.ip-date{font-size:12px;color:var(--blue);margin-top:2px;}
.prog-bar{background:rgba(255,255,255,.06);border-radius:30px;height:5px;
  margin-bottom:5px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));
  border-radius:30px;transition:width .3s;}
.prog-lbl{font-size:12px;color:var(--muted);margin-bottom:14px;}
.prog-lbl span{color:var(--green);font-weight:700;}
.p-row{background:var(--card);border:2px solid var(--border);border-radius:12px;
  padding:11px 13px;margin-bottom:8px;transition:all .2s;}
.p-row.s-present{border-color:var(--green);background:rgba(16,185,129,.07);}
.p-row.s-rest{border-color:var(--gold);background:rgba(245,158,11,.07);}
.p-row.s-hol{border-color:var(--pink);background:rgba(236,72,153,.07);}
.p-row.s-sick{border-color:var(--blue);background:rgba(59,130,246,.07);}
.p-row.s-vac{border-color:var(--purple);background:rgba(139,92,246,.07);}
.p-row.s-abs{border-color:var(--red);background:rgba(239,68,68,.07);}
.p-name{font-size:14px;font-weight:700;margin-bottom:8px;}
.p-tag{font-size:11px;color:var(--muted);font-weight:400;}
.p-btns{display:flex;gap:6px;flex-wrap:wrap;}
.sb{padding:7px 11px;border-radius:8px;border:2px solid transparent;
  font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;
  cursor:pointer;opacity:.38;transition:all .15s;}
.sb:active{transform:scale(.92);}
.sb-p{background:rgba(16,185,129,.15);color:var(--green);}
.sb-r{background:rgba(245,158,11,.15);color:var(--gold);}
.sb-h{background:rgba(236,72,153,.15);color:var(--pink);}
.sb-m{background:rgba(59,130,246,.15);color:var(--blue);}
.sb-v{background:rgba(139,92,246,.15);color:var(--purple);}
.sb-a{background:rgba(239,68,68,.15);color:var(--red);}
.sb.on{opacity:1;border-color:currentColor;}
.p-note{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:8px;padding:8px 11px;color:var(--text);font-family:'Cairo',sans-serif;
  font-size:12px;outline:none;margin-top:8px;display:none;}
.p-note::placeholder{color:var(--muted);}
.sub-btn{width:100%;padding:15px;background:linear-gradient(135deg,var(--blue),var(--purple));
  border:none;border-radius:13px;color:#fff;font-family:'Cairo',sans-serif;
  font-size:16px;font-weight:900;cursor:pointer;margin-top:10px;
  box-shadow:0 4px 20px rgba(59,130,246,.3);}
.sub-btn:disabled{opacity:.5;cursor:not-allowed;}

.cs{text-align:center;padding:70px 20px;}
.cs-icon{font-size:60px;margin-bottom:16px;animation:pop .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.cs-title{font-size:21px;font-weight:900;margin-bottom:8px;}
.cs-sub{font-size:14px;color:var(--muted);line-height:1.9;}

.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);
  backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;}
.ov.open{display:flex;}
.modal{background:var(--sur);border:1px solid var(--border);border-radius:17px;
  padding:24px 20px;width:calc(100% - 28px);max-width:380px;}
.modal h3{font-size:17px;font-weight:900;margin-bottom:5px;}
.modal p{font-size:13px;color:var(--muted);margin-bottom:14px;}
.modal-row{display:flex;gap:7px;}
.modal-foot{display:flex;gap:8px;margin-top:14px;}
.modal-foot .btn{flex:1;padding:12px;border-radius:11px;}

.toast{position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%) translateY(70px);padding:11px 24px;border-radius:28px;
  font-weight:900;font-size:14px;z-index:500;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 20px rgba(0,0,0,.3);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--green);color:#001a0a;}
.toast.warn{background:var(--gold);color:#1a0a00;}
.toast.err{background:var(--red);color:#fff;}
.empty{text-align:center;padding:45px 20px;color:var(--muted);}
.empty .ei{font-size:42px;margin-bottom:9px;}
.loading{text-align:center;padding:30px;color:var(--muted);font-size:14px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginWrap" class="login-wrap">
  <div class="login-box">
    <div class="login-icon">&#128274;</div>
    <div class="login-title">لوحة المسؤول</div>
    <div class="login-sub">ادخل بياناتك للدخول</div>
    <input type="text"     id="lUser" class="login-input" placeholder="اسم المستخدم">
    <input type="password" id="lPass" class="login-input" placeholder="كلمة المرور">
    <button class="login-btn" id="loginBtn">دخول</button>
    <div class="login-err" id="lErr"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="adminUI" style="display:none">
  <div class="hdr">
    <div class="hdr-l">
      <div class="hdr-icon">&#9875;</div>
      <div>
        <div class="hdr-title">لوحة المسؤول</div>
        <div class="hdr-sub">نظام تسجيل الحضور</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="badge badge-gold">مسؤول</div>
      <button class="btn-logout" id="logoutBtn">خروج</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" id="tab-stations">المحطات</button>
    <button class="tab"    id="tab-links">الروابط</button>
    <button class="tab"    id="tab-records">السجلات</button>
  </div>

  <div class="view on" id="view-stations">
    <div class="sec">اضافة محطة</div>
    <div class="row">
      <input type="text" id="inSt"  placeholder="اسم المحطة">
      <input type="text" id="inMgr" placeholder="اسم المدير">
      <button class="btn btn-blue" id="addStBtn">+</button>
    </div>
    <div class="sec" style="margin-top:22px">المحطات</div>
    <div id="stList"><div class="loading">جاري التحميل...</div></div>
  </div>

  <div class="view" id="view-links">
    <div class="info-box ib-green">
      كل رابط يشتغل مرة واحدة في اليوم. في اليوم التالي يشتغل تلقائيا من جديد.
    </div>
    <div id="linksBox"></div>
  </div>

  <div class="view" id="view-records">
    <div class="stats">
      <div class="stat"><div class="stat-n b" id="sN">0</div><div class="stat-l">تقارير</div></div>
      <div class="stat"><div class="stat-n g" id="sT">0</div><div class="stat-l">محطات</div></div>
      <div class="stat"><div class="stat-n gr" id="sS">0</div><div class="stat-l">موظفين</div></div>
    </div>
    <div class="row" style="margin-bottom:10px">
      <input type="date" id="dateInput">
      <button class="btn btn-blue"  id="searchBtn">بحث</button>
      <button class="btn btn-ghost" id="todayBtn">اليوم</button>
    </div>
    <div class="chips" id="filterChips"></div>
    <div style="display:flex;gap:8px;margin-bottom:18px">
      <button class="btn btn-green" style="flex:1;padding:13px;border-radius:12px" id="expDayBtn">تصدير اليوم</button>
      <button class="btn btn-blue"  style="flex:1;padding:13px;border-radius:12px" id="expMonBtn">تصدير الشهر</button>
      <button class="btn btn-red"   style="flex:1;padding:13px;border-radius:12px" id="delAllBtn">حذف</button>
    </div>
    <div id="recList"></div>
  </div>
</div>

<!-- MANAGER -->
<div id="mgrUI" style="display:none">
  <div class="hdr">
    <div class="hdr-l">
      <div class="hdr-icon">&#128203;</div>
      <div>
        <div class="hdr-title" id="mgrTitle">تسجيل الحضور</div>
        <div class="hdr-sub"   id="mgrSub"></div>
      </div>
    </div>
    <div class="badge badge-blue">مدير</div>
  </div>
  <div id="mgrBody"></div>
</div>

<!-- MODAL -->
<div class="ov" id="empOv">
  <div class="modal">
    <h3>اضافة موظف</h3>
    <p id="empOvSub"></p>
    <div class="modal-row">
      <input type="text" id="empIn" placeholder="اسم الموظف">
      <button class="btn btn-blue" id="addEmpBtn">اضافة</button>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="closeEmpBtn">اغلاق</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

// ══ CONFIG ══
var SB_URL    = 'https://plvjfmkbcmulfubiiwyw.supabase.co';
var SB_KEY    = 'sb_publishable_L6fcrQBAOsJv9Wh04wP7ww_h0Xxsl0H';
var BOT_TOKEN = '8910031215:AAFUya-l3VyoXAOMlvxd4zb6DpUGFhiDEw8';
var CHAT_ID   = '870811910';

// ══ USERS ══
var USERS = [
  {u:'admin',  p:'admin123'},
  {u:'hisham', p:'1234'}
];

// ══ STATE ══
var stations  = []; // من Supabase
var records   = [];
var filterSt  = 'all';
var activeStId = null;
var todayISO  = new Date().toISOString().split('T')[0];

// ══ SUPABASE ══
var SBH = {
  'Content-Type':'application/json',
  'apikey':SB_KEY,
  'Authorization':'Bearer '+SB_KEY
};

function sbGet(table, q, cb){
  fetch(SB_URL+'/rest/v1/'+table+'?'+q, {headers:SBH})
    .then(function(r){return r.ok?r.json():[];})
    .then(cb).catch(function(){cb([]);});
}
function sbPost(table, body, prefer){
  var h = Object.assign({},SBH,{'Prefer':prefer||'return=minimal'});
  return fetch(SB_URL+'/rest/v1/'+table,{method:'POST',headers:h,body:JSON.stringify(body)})
    .then(function(r){return r.ok;}).catch(function(){return false;});
}
function sbPatch(table, q, body){
  var h = Object.assign({},SBH,{'Prefer':'return=minimal'});
  return fetch(SB_URL+'/rest/v1/'+table+'?'+q,{method:'PATCH',headers:h,body:JSON.stringify(body)})
    .then(function(r){return r.ok;}).catch(function(){return false;});
}
function sbDel(table, q){
  return fetch(SB_URL+'/rest/v1/'+table+'?'+q,{method:'DELETE',headers:SBH})
    .then(function(r){return r.ok;}).catch(function(){return false;});
}

// ══ STATIONS — Supabase ══
function loadStations(cb){
  sbGet('stations','select=*&order=id.asc',function(rows){
    stations = rows || [];
    if(cb) cb();
  });
}
function saveStation(s, cb){
  // upsert
  var h = Object.assign({},SBH,{'Prefer':'resolution=merge-duplicates,return=minimal'});
  fetch(SB_URL+'/rest/v1/stations',{method:'POST',headers:h,body:JSON.stringify({
    id:s.id, name:s.name, manager:s.manager, employees:s.employees
  })}).then(function(){if(cb)cb();}).catch(function(){if(cb)cb();});
}
function deleteStation(id, cb){
  sbDel('stations','id=eq.'+id).then(function(){if(cb)cb();});
}

function doLogin(){

  var p=document.getElementById('lPass').value;
  var ok=false;
  for(var i=0;i<USERS.length;i++){if(USERS[i].u===u&&USERS[i].p===p){ok=true;break;}}
  if(ok){
    localStorage.setItem('att_sess','1');

    document.getElementById('adminUI').style.display='block';
    initAdmin();
  } else {

  }
}

window._copyLink=function(sid){
  var el=document.getElementById('url_'+sid);
  if(!el)return;
  var url=el.textContent;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){toast('تم نسخ الرابط','ok');})
      .catch(function(){fbCopy(url);});
  } else fbCopy(url);
};
function fbCopy(t){
  var ta=document.createElement('textarea');
  ta.value=t;ta.style.cssText='position:fixed;opacity:0;top:0;left:0;width:1px;height:1px';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');toast('تم نسخ الرابط','ok');}
  catch(e){toast('اضغط مطولا على الرابط وانسخه','warn');}
  document.body.removeChild(ta);
}

// ══ MANAGER UI ══
var STATUSES=[
  {key:'حاضر',  cls:'sb-p',card:'s-present',note:false},
  {key:'راحة',  cls:'sb-r',card:'s-rest',   note:true},
  {key:'عطلة',  cls:'sb-h',card:'s-hol',    note:true},
  {key:'مرضي',  cls:'sb-m',card:'s-sick',   note:true},
  {key:'اجازة', cls:'sb-v',card:'s-vac',    note:true},
  {key:'انقطاع',cls:'sb-a',card:'s-abs',    note:true}
];

function showMgr(info,lockKey){
  document.getElementById('mgrTitle').textContent=info.stationName;
  document.getElementById('mgrSub').textContent='المدير: '+info.managerName;
  document.title=info.stationName+' - تسجيل الحضور';

  var people=info.employees.indexOf(info.managerName)!==-1
    ?info.employees:[info.managerName].concat(info.employees);
  var total=people.length;
  var att={};
  var dateStr=new Date().toLocaleDateString('ar-EG',
    {weekday:'long',year:'numeric',month:'long',day:'numeric'});

  var cardsHTML=people.map(function(name){
    var isMgr=name===info.managerName;
    var btns=STATUSES.map(function(s){
      return '<button class="sb '+s.cls+'" id="sb_'+CSS.escape(name)+'_'+s.key+'"'+
        ' onclick="window._mAtt(\''+name.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\''+
        ',\''+s.key+'\')">'+s.key+'</button>';
    }).join('');
    return '<div class="p-row" id="pr_'+CSS.escape(name)+'">'+
      '<div class="p-name">'+name+(isMgr?' <span class="p-tag">(مدير)</span>':'')+' </div>'+
      '<div class="p-btns">'+btns+'</div>'+
      '<input class="p-note" id="pn_'+CSS.escape(name)+'" placeholder="ملاحظة (اختياري)">'+
    '</div>';
  }).join('');

  document.getElementById('mgrBody').innerHTML=
    '<div class="mgr-wrap">'+
      '<div class="ip">'+
        '<div class="ip-station">'+info.stationName+'</div>'+
        '<div class="ip-mgr">المدير: '+info.managerName+'</div>'+
        '<div class="ip-date">'+dateStr+'</div>'+
      '</div>'+
      '<div class="prog-bar"><div class="prog-fill" id="pf" style="width:0%"></div></div>'+
      '<div class="prog-lbl">سجلت <span id="dc">0</span> من '+total+' شخص</div>'+
      cardsHTML+
      '<button class="sub-btn" id="subBtn">ارسال التقرير</button>'+
    '</div>';

  window._mAtt=function(name,status){
    att[name]=status;
    var st=STATUSES.find(function(s){return s.key===status;});
    var card=document.getElementById('pr_'+CSS.escape(name));
    if(card)card.className='p-row '+(st?st.card:'');
    STATUSES.forEach(function(s){
      var b=document.getElementById('sb_'+CSS.escape(name)+'_'+s.key);
      if(b)b.classList.toggle('on',s.key===status);
    });
    var noteEl=document.getElementById('pn_'+CSS.escape(name));
    if(noteEl)noteEl.style.display=(st&&st.note)?'block':'none';
    var done=Object.keys(att).length;
    document.getElementById('dc').textContent=done;
    document.getElementById('pf').style.width=Math.round(done/total*100)+'%';
  };

  document.getElementById('subBtn').addEventListener('click',function(){
    var missing=people.filter(function(n){return !att[n];});
    if(missing.length){
      toast('سجل حالة '+missing[0]+' اولا','warn');
      var el=document.getElementById('pr_'+CSS.escape(missing[0]));
      if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
    var btn=document.getElementById('subBtn');
    btn.disabled=true;btn.textContent='جاري الارسال...';
    var now=new Date();
    var date=now.toLocaleDateString('ar-EG');
    var time=now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
    var emps=people.map(function(n){
      var ne=document.getElementById('pn_'+CSS.escape(n));
      return {name:n,status:att[n],note:(ne&&att[n]!=='حاضر')?ne.value.trim():''};
    });
    sbPost('attendance',{
      station:info.stationName,manager:info.managerName,
      report_date:date,report_date_iso:now.toISOString().split('T')[0],
      report_time:time,employees:emps
    }).then(function(ok){
      var groups={};
      STATUSES.forEach(function(s){groups[s.key]=[];});
      emps.forEach(function(e){
        var lbl=e.note?e.name+'('+e.note+')':e.name;
        if(groups[e.status])groups[e.status].push(lbl);
      });
      var msg='تقرير حضور\n'+info.stationName+' - '+info.managerName+'\n'+date+' - '+time+'\n---\n';
      STATUSES.forEach(function(s){
        if(groups[s.key].length)msg+=s.key+': '+groups[s.key].join(', ')+'\n';
      });
      fetch('https://api.telegram.org/bot'+BOT_TOKEN+'/sendMessage',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({chat_id:CHAT_ID,text:msg})
      }).catch(function(){});
      if(lockKey)localStorage.setItem(lockKey,'1');
      document.getElementById('mgrBody').innerHTML=
        '<div class="cs"><div class="cs-icon">&#10003;</div>'+
        '<div class="cs-title">تم ارسال التقرير</div>'+
        '<div class="cs-sub">'+info.stationName+'<br>'+
        (ok?'تم الحفظ بنجاح':'تحقق من الاتصال')+'<br>هذا الرابط مقفول اليوم</div></div>';
    });
  });
}

function setupRecordsBtns(){

      '</div><div class="pills">'+pills+'</div></div>';
  }).join('');
}
window._setF=function(v){filterSt=v;renderRecs();};
window._delRec=function(id){

  sbDel('attendance','id=eq.'+id).then(function(ok){
    if(ok){records=records.filter(function(r){return r.id!==id;});renderRecs();toast('تم الحذف','ok');}
    else toast('فشل الحذف','err');
  });
};

// ══ EXCEL ══
function buildExcel(data,dateLabel,isMonth){
  if(!data||!data.length){toast('لا توجد بيانات','warn');return;}
  if(typeof XLSX==='undefined'){toast('انتظر ثم حاول مرة اخرى','warn');return;}

  var now=new Date();
  var y=now.getFullYear();
  var m=now.getMonth();
  var days=[];

  if(isMonth){
    var last=new Date(y,m+1,0).getDate();
    for(var d=1;d<=last;d++){
      var dd=String(d).padStart(2,'0');
      var mm=String(m+1).padStart(2,'0');
      days.push({lbl:dd+'/'+mm,iso:y+'-'+mm+'-'+dd});
    }
  } else {
    var iso=dateLabel||todayISO;
    var p=iso.split('-');
    days.push({lbl:p[2]+'/'+p[1],iso:iso});
  }

  var dataMap={};
  data.forEach(function(r){
    if(!dataMap[r.station])dataMap[r.station]={};
    (r.employees||[]).forEach(function(e){
      if(!dataMap[r.station][e.name])dataMap[r.station][e.name]={};
      dataMap[r.station][e.name][r.report_date_iso]={status:e.status||'-',note:e.note||''};
    });
  });

  var sts=stations.length?stations:
    Array.from(new Set(data.map(function(r){return r.station;}))).map(function(name){
      return {name:name,
        manager:(data.find(function(r){return r.station===name;})||{}).manager||'',
        employees:Array.from(new Set(data.filter(function(r){return r.station===name;})
          .reduce(function(a,r){return a.concat((r.employees||[]).map(function(e){return e.name;}));},[])))};
    });

  var wb=XLSX.utils.book_new();

  sts.forEach(function(st){
    var sd=dataMap[st.name]||{};
    var pp=(st.employees||[]).indexOf(st.manager)!==-1
      ?(st.employees||[]):[st.manager].concat(st.employees||[]);

    var hdr=['الموظف'].concat(days.map(function(d){return d.lbl;}))
      .concat(['حاضر','راحة','عطلة','مرضي','اجازة','انقطاع','نسبة الحضور']);

    var rows=pp.map(function(name){
      var ed=sd[name]||{};
      function cnt(k){return days.filter(function(d){return(ed[d.iso]||{}).status===k;}).length;}
      var cells=days.map(function(d){
        var e=ed[d.iso];
        if(!e||!e.status||e.status==='-')return '-';
        return e.note?e.status+' - '+e.note:e.status;
      });
      var pr=cnt('حاضر'),rs=cnt('راحة'),hl=cnt('عطلة'),sk=cnt('مرضي'),vc=cnt('اجازة'),ab=cnt('انقطاع');
      var tt=pr+rs+hl+sk+vc+ab;
      return [name].concat(cells).concat([pr,rs,hl,sk,vc,ab,tt?Math.round(pr/tt*100)+'%':'-']);
    });

    var ws=XLSX.utils.aoa_to_sheet([hdr].concat(rows));
    ws['!cols']=[{wch:16}].concat(days.map(function(){return{wch:isMonth?13:18};}))
      .concat([{wch:9},{wch:9},{wch:9},{wch:9},{wch:9},{wch:11},{wch:13}]);
    XLSX.utils.book_append_sheet(wb,ws,st.name.substring(0,31));
  });

  var sh=['الموظف','المحطة','المدير','حاضر','راحة','عطلة','مرضي','اجازة','انقطاع','نسبة الحضور'];
  var sr=[];
  sts.forEach(function(st){
    var sd=dataMap[st.name]||{};
    var pp=(st.employees||[]).indexOf(st.manager)!==-1
      ?(st.employees||[]):[st.manager].concat(st.employees||[]);
    pp.forEach(function(name){
      var ed=sd[name]||{};
      function cnt(k){return days.filter(function(d){return(ed[d.iso]||{}).status===k;}).length;}
      var pr=cnt('حاضر'),rs=cnt('راحة'),hl=cnt('عطلة'),sk=cnt('مرضي'),vc=cnt('اجازة'),ab=cnt('انقطاع');
      var tt=pr+rs+hl+sk+vc+ab;
      sr.push([name,st.name,st.manager,pr,rs,hl,sk,vc,ab,tt?Math.round(pr/tt*100)+'%':'-']);
    });
  });
  var ws2=XLSX.utils.aoa_to_sheet([sh].concat(sr));
  ws2['!cols']=[{wch:16},{wch:16},{wch:16},{wch:9},{wch:9},{wch:9},{wch:9},{wch:9},{wch:11},{wch:13}];
  XLSX.utils.book_append_sheet(wb,ws2,'ملخص');

  var fname=isMonth
    ?'حضور_شهر_'+now.toLocaleDateString('ar-EG',{month:'long',year:'numeric'}).replace(' ','-')+'.xlsx'
    :'حضور_يوم_'+(dateLabel||todayISO)+'.xlsx';

  var wbout=XLSX.write(wb,{bookType:'xlsx',type:'base64'});
  var a=document.createElement('a');
  a.href='data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,'+wbout;
  a.download=fname;
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  toast('تم تصدير Excel','ok');
}

// ══ TOAST ══
function toast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show '+(type||'ok');
  setTimeout(function(){t.classList.remove('show');},2600);
}

})();
</script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
